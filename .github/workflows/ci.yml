name: CI

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  nim-tests:
    name: Nim tests (macOS)
    # macOS-only leg: the renderer's JNI surface is validated on macOS today.
    runs-on: [self-hosted, macos, arm64]
    steps:
      # The suites compile against two sibling repositories that are not part
      # of this checkout: `nim.cfg` puts `../isonim/src` and
      # `../nim-everywhere/src` on the module path. They used to come from
      # `actions/checkout` steps with `path: ../isonim` and
      # `path: ../nim-everywhere`, which `actions/checkout` refuses
      # ("Repository path '.../isonim-android/isonim' is not under
      # '.../isonim-android/isonim-android'"), so this job died on its second
      # step on every run.
      #
      # `setup-dev-env` clones each entry of `.github/sibling-repos` to
      # `../<name>` at the revision recorded there, and provisions Nix with the
      # shared setup-nix action (Nix is already on the self-hosted runners;
      # binary-cache traffic goes through the org Attic substituter), which
      # replaces the DeterminateSystems installer and magic-nix-cache actions.
      # Its token is minted from the CI Token Provider app, the same way
      # `ci-reprobuild.yml` mints it.
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4

      - name: Setup dev env (clones .github/sibling-repos)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}

      - name: nim check (renderer — Android JNI surface)
        run: nix develop -c bash -c "nim check -d:mockJni nim-lib/src/isonim_android/renderer.nim"

      - name: Run JNI stub smoke tests
        run: nix develop -c bash -c "just test"

      # The task-app demo's host-side end-to-end tests live in
      # `isonim-examples/tests/test_android_leaves_compile.nim` and
      # `tests/test_android_leaves_android_only.nim` since EX-M6 (the
      # standalone `demos/task-manager/src/main.nim` was deleted
      # alongside the duplicated source). Cross-renderer parity
      # (TUI / web / GPUI / Freya / Cocoa / Android) is covered in
      # `isonim-examples/tests/test_vm_parity_across_renderers.nim`.
      # Cross-repo CI gating happens in the `isonim-examples` workflow;
      # this repo only verifies the renderer + JNI surface here.
      #
      # The Tier 2 (Robolectric) + Tier 3 (instrumented) suites and
      # Paparazzi snapshot tests are gated separately because they
      # require Gradle + a connected device or emulator. See
      # `Justfile` recipes `test-robolectric`, `test-device`,
      # `test-snapshots`.
